<text x="0" y="188" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">(B to book</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">double left click </tspan><tspan fill="#a9b1d6">open: enter folder or open fi~</tspan><tspan fill="#e0af68">:copy &lt;dest&gt;      </tspan><tspan fill="#a9b1d6">copy selection                </tspan><tspan fill="#7dcfff">|</tspan></text>
