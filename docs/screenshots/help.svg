<text x="0" y="236" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">pkg </tspan><tspan fill="#a9b1d6">packa</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">v                 </tspan><tspan fill="#a9b1d6">visual multi-selection mode   </tspan><tspan fill="#e0af68">:cd &lt;path&gt;        </tspan><tspan fill="#a9b1d6">change directory              </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="252" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">img </tspan><tspan fill="#a9b1d6">photo</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">.                 </tspan><tspan fill="#a9b1d6">toggle hidden files           </tspan><tspan fill="#e0af68">:quit             </tspan><tspan fill="#a9b1d6">quit                          </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="268" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">lnk </tspan><tspan fill="#a9b1d6">READM</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">t                 </tspan><tspan fill="#a9b1d6">toggle last used tag          </tspan><tspan fill="#e0af68">:help             </tspan><tspan fill="#a9b1d6">this help                     </tspan><tspan fill="#7dcfff">|</tspan></text>
