<text x="0" y="76" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">ts </tspan><tspan fill="#a9b1d6">app.ts</tspan><tspan fill="#7dcfff">+ HELP --------------------------------------------------------------------------------------------+</tspan></text>
<text x="0" y="92" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">zip </tspan><tspan fill="#a9b1d6">archi</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">j / Down          </tspan><tspan fill="#a9b1d6">move down                     </tspan><tspan fill="#e0af68">q                 </tspan><tspan fill="#a9b1d6">quit                          </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="108" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">sh </tspan><tspan fill="#a9b1d6">build.</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">k / Up            </tspan><tspan fill="#a9b1d6">move up                       </tspan><tspan fill="#e0af68">:copy &lt;dest&gt;      </tspan><tspan fill="#a9b1d6">copy selection                </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="124" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">clk </tspan><tspan fill="#a9b1d6">Cargo</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">h / Left          </tspan><tspan fill="#a9b1d6">parent directory              </tspan><tspan fill="#e0af68">:move &lt;dest&gt;      </tspan><tspan fill="#a9b1d6">move selection                </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="140" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">cgo </tspan><tspan fill="#a9b1d6">Cargo</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">l / Right / Enter </tspan><tspan fill="#a9b1d6">enter directory or open file  </tspan><tspan fill="#e0af68">:rename &lt;name&gt;    </tspan><tspan fill="#a9b1d6">rename entry                  </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="156" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">jsn </tspan><tspan fill="#a9b1d6">data.</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">g g               </tspan><tspan fill="#a9b1d6">first entry                   </tspan><tspan fill="#e0af68">:delete           </tspan><tspan fill="#a9b1d6">delete selection (confirmed)  </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="172" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">exe </tspan><tspan fill="#a9b1d6">deplo</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">G                 </tspan><tspan fill="#a9b1d6">last entry                    </tspan><tspan fill="#e0af68">:tag &lt;name&gt;       </tspan><tspan fill="#a9b1d6">assign tag                    </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="188" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">htm </tspan><tspan fill="#a9b1d6">index</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">Ctrl-u / Ctrl-d   </tspan><tspan fill="#a9b1d6">half page up / down           </tspan><tspan fill="#e0af68">:untag &lt;name&gt;     </tspan><tspan fill="#a9b1d6">remove tag                    </tspan><tspan fill="#7dcfff">|</tspan></text>
<text x="0" y="204" font-family="monospace" font-size="14" xml:space="preserve"><tspan fill="#414868">rs </tspan><tspan fill="#a9b1d6">main.r</tspan><tspan fill="#7dcfff">|</tspan><tspan fill="#e0af68">PageUp / PageDown </tspan><tspan fill="#a9b1d6">full page up / down           </tspan><tspan fill="#e0af68">:tags             </tspan><tspan fill="#a9b1d6">open tag picker               </tspan><tspan fill="#7dcfff">|</tspan></text>
