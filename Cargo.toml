[package]
name = "tui-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Fast terminal file explorer for Linux with mouse support, Vim-style controls, ASCII icons, and persistent tags"
license = "MIT"
repository = "https://github.com/0bifthenelse/tui-explorer"
homepage = "https://github.com/0bifthenelse/tui-explorer"
keywords = ["tui", "file-manager", "terminal", "file-explorer", "vim"]
categories = ["command-line-utilities"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
system-sqlite = []

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = "0.32"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
age = "0.11"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = "5"
libc = "0.2"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "adpcm", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rustfft = "6.4.1"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
vt100 = "0.15"
